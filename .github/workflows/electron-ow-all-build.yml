name: Build WowUp Electron All CF
on:
  # - push
  workflow_dispatch:

jobs:
  # create-release:
  #   name: Create Release
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Create Release
  #       id: create_release
  #       uses: actions/create-release@v1
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
  #       with:
  #         tag_name: ${{ github.ref }}
  #         release_name: Release ${{ github.ref }}
  #         draft: true
  #         prerelease: true

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, "macos-latest"]
        node-version: [24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Inject Token
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          cd ./wowup-electron
          node ./inject-token.js

      - name: Install lib dependencies
        run: |
          cd ./wowup-lib
          npm install

      - name: Install Angular CLI
        run: npm install -g @angular/cli

      - name: dmg-license
        if: matrix.os == 'macos-latest'
        run: |
          cd ./wowup-electron
          npm i dmg-license

      - name: Chceckout-CF
        if: matrix.os == 'ubuntu-latest'
        uses: actions/checkout@v4
        with:
          repository: 'WowUp/WowUp.CF'
          token: ${{ secrets.WOWUP_CF_REPO_KEY }}
          path: 'wowup-cf'

      - name: Create CF Change
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd ./wowup-cf
          date +%s > wowup-build-dt.txt
          git config --global user.name 'zakrn'
          git config --global user.email 'zakrn@wowup.io'
          git commit -am "WowUp Main Build"
          git push

      - name: Build Linux App
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.WOWUP_CF_REPO_KEY }} # This token is provided by Actions, you do not need to create your own token
        run: |
          cd ./wowup-electron
          npm ci
          npm run ow:electron:publish

      - name: Set up signing keychain
        if: matrix.os == 'macos-latest'
        env:
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # electron-builder < 26.16 and every @overwolf/ow-electron-builder release pass
          # the p12 password to `security set-key-partition-list -k`, which wants the
          # keychain's own password. macOS 26.6 turned that into a hard error, so build
          # the keychain here and hand it over via CSC_KEYCHAIN instead of CSC_LINK.
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/wowup-signing.keychain"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/macos-cert.p12"
          echo "$MACOS_CERT" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if [ ! -f "$KEYCHAIN" ] && [ -f "$KEYCHAIN-db" ]; then KEYCHAIN="$KEYCHAIN-db"; fi
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"
          IDENTITIES=$(security find-identity -v -p codesigning "$KEYCHAIN")
          echo "$IDENTITIES"
          case "$IDENTITIES" in
            *"Developer ID Application"*) ;;
            *) echo "::error::No Developer ID Application identity found in $KEYCHAIN"; exit 1 ;;
          esac
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build Mac App
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.WOWUP_CF_REPO_KEY }} # This token is provided by Actions, you do not need to create your own token
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_APPLE_PASSWORD: ${{ secrets.NOTARIZE_APPLE_PASSWORD }}
          NOTARIZE_APPLE_TEAM_ID: ${{ secrets.NOTARIZE_APPLE_TEAM_ID }}
        run: |
          cd ./wowup-electron
          npm ci
          npm run ow:electron:publish

      - name: Get ssl.com esigner zip file and unzip
        if: matrix.os == 'windows-2022'
        run: |
          cd ./wowup-electron/electron-build
          mkdir code_signer
          cd ./code_signer
          Write-Host "Downloading CodeSignTool from GitHub releases..."
          powershell -Command "Invoke-WebRequest -Uri 'https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip' -OutFile 'out.zip' -Verbose"
          Write-Host "Expanding CodeSignTool archive..."
          powershell -Command "Expand-Archive -Path 'out.zip' -DestinationPath '.' -Force -Verbose"
          Write-Host "Done extracting CodeSignTool."
          cd ../../..

      - name: Build Windows App
        if: matrix.os == 'windows-2022'
        env:
          GH_TOKEN: ${{ secrets.WOWUP_CF_REPO_KEY }} # This token is provided by Actions, you do not need to create your own token
          WINDOWS_SIGN_USER_NAME: ${{ secrets.WINDOWS_SIGN_USER_NAME }}
          WINDOWS_SIGN_USER_PASSWORD: ${{ secrets.WINDOWS_SIGN_USER_PASSWORD }}
          WINDOWS_SIGN_CREDENTIAL_ID_PROD: ${{ secrets.WINDOWS_SIGN_CREDENTIAL_ID_PROD }}
          WINDOWS_SIGN_CREDENTIAL_ID_NONPROD: ${{ secrets.WINDOWS_SIGN_CREDENTIAL_ID_NONPROD }}
          WINDOWS_SIGN_USER_TOTP_PROD: ${{ secrets.WINDOWS_SIGN_USER_TOTP_PROD }}
          WINDOWS_SIGN_USER_TOTP_NONPROD: ${{ secrets.WINDOWS_SIGN_USER_TOTP_NONPROD }}
        run: cd ./wowup-electron && npm ci && npm run ow:electron:publish
