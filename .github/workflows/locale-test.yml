name: Angular Locale Test

on:
  pull_request:
    branches: [ develop ]

jobs:

  build:
    strategy:
      matrix:
        configuration: [Release]
        node-version: [ 24.x ]

    runs-on: ubuntu-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install lib dependencies
      run: |
        cd ./wowup-lib
        npm install

    - name: Install Angular CLI
      run: npm install -g @angular/cli

    - name: Install Deps
      run: |
        cd ./wowup-electron
        npm i --force

    # Ubuntu runners block the unprivileged user namespaces Electron's sandbox would otherwise use,
    # so the karma Electron launcher aborts unless the setuid helper is set up the way it asks.
    # Electron only downloads its binary on first use, so fetch it now to have the helper to fix.
    - name: Configure Electron sandbox
      run: |
        cd ./wowup-electron
        node node_modules/electron/install.js
        sudo chown root:root node_modules/electron/dist/chrome-sandbox
        sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

    - name: Lint
      run: |
        cd ./wowup-electron
        ng lint

    - name: Test Locales
      run: |
        sudo apt-get install xvfb
        cd ./wowup-electron 
        xvfb-run --auto-servernum ng test --watch=false --include='src/locales.spec.ts'

    - name: Run Test Suite
      run: |
        sudo apt-get install xvfb
        cd ./wowup-electron
        xvfb-run --auto-servernum ng test --watch=false
